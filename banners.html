<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner samples</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Sample page only (dev branch): two ways the team banners could sit in a team's result box. */
.opt{margin:28px 0 8px;font-family:var(--display);color:var(--gold);font-size:24px}
.opt small{font-family:var(--body);color:var(--muted);font-size:.9rem;margin-left:8px}
.countdown.team{padding:0;overflow:hidden}
.countdown.team .inner{padding:18px 22px}
.bn-full{display:block;width:100%;height:auto;border-bottom:2px solid var(--c)}
.bn-head{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.bn-crop{height:120px;width:auto;border-radius:6px;border:2px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bn-crop.wide{height:70px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><h1>Banner samples</h1><p class="sub">How each team banner could look in that team's result box. <a href="./?demo=won" style="color:var(--gold)">Back to the demo</a></p></div></header>
  <div id="samples"></div>
</div>
<script>
const TEAMS = [
  {id:"tt", name:"Thompy Thiccs", note:"came 1st", wide:false},
  {id:"dd", name:"The Desert Dogs", note:"came 2nd", wide:false},
  {id:"bk", name:"The Bakery", note:"came 3rd", wide:true}
];
const body = t => `<p class="when">4 of 5 on their best line · <b>8</b> tiles</p><p class="congrats">Player contributions</p>
  <div class="roll"><div><b class="who">Player one</b><span><b>2</b> tiles · <b>5</b> drops</span></div><div><b class="who">Player two</b><span><b>1</b> tile · <b>3</b> drops</span></div><div><b class="who">Player three</b><span><b>0</b> tiles · <b>2</b> drops</span></div></div>`;
document.getElementById("samples").innerHTML = TEAMS.map(t => `
  <h2 class="opt">${t.name}: A <small>full banner across the top</small></h2>
  <div class="countdown team" style="--c:var(--${t.id})">
    <img class="bn-full" src="images/web/${t.id}-full.jpg" alt="">
    <div class="inner"><h2>${t.name} ${t.note}</h2>${body(t)}</div>
  </div>
  <h2 class="opt">${t.name}: B <small>centre crop beside the title</small></h2>
  <div class="countdown team" style="--c:var(--${t.id})">
    <div class="inner"><div class="bn-head"><img class="bn-crop${t.wide ? " wide" : ""}" src="images/web/${t.id}-crop.jpg" alt=""><h2>${t.name} ${t.note}</h2></div>${body(t)}</div>
  </div>`).join("");
</script>
</body>
</html>
