# Every 30 minutes: read the clan's TempleOSRS group and save the board's data.
# update.js does nothing (and doesn't contact Temple) until config.json is filled in,
# or outside the event window. It can also be run by hand from the Actions tab.
name: Update board

on:
  schedule:
    - cron: "7,37 * * * *"   # off the hour, when GitHub's scheduler is less busy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    # While the repo is private, scheduled runs are skipped (no Actions minutes used).
    # Running it by hand from the Actions tab still works.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from TempleOSRS
        run: node update.js

      - name: Save new data
        run: |
          [ -d data ] || { echo "No data yet."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update board data"
            git pull --rebase
            git push
          fi
