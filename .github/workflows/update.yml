# Every 30 minutes: read the clan's TempleOSRS group and save the board's data.
# update.js does nothing (and doesn't contact Temple) until config.json is filled in,
# or outside the event window. It can also be run by hand from the Actions tab.
name: Update board

on:
  repository_dispatch:
    types: [update-board]    # started every 30 min by the Cloudflare Worker's Cron Trigger
  schedule:
    - cron: "7,37 * * * *"   # backup only: GitHub's scheduler can run hours late
  workflow_dispatch:

permissions:
  contents: write
  actions: write    # to switch these workflows off once the results are final

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    # While the repo is private, scheduled runs are skipped (no Actions minutes used).
    # Running it by hand from the Actions tab still works.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from TempleOSRS
        run: node update.js

      - name: Save new data
        run: |
          [ -d data ] || { echo "No data yet."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update board data"
            git pull --rebase
            git push
          fi

      # After a Bingo (plus verify_hours for late drops) the results are final: turn off this
      # job and the roster check so nothing keeps running. Re-enable them from the Actions tab.
      - name: Stop once the results are final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/state.json ] && node -e "process.exit(require('./data/state.json').final ? 0 : 1)"; then
            gh workflow disable update.yml --repo "$GITHUB_REPOSITORY"
            gh workflow disable roster.yml --repo "$GITHUB_REPOSITORY"
            echo "Results are final: both scheduled workflows are now off."
          fi
