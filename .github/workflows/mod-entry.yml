# Rebuilds the board, and the preview board, right after a mod adds or removes an entry.
# The Cloudflare Worker (worker/) starts this through GitHub's repository_dispatch, so it
# doesn't wait for the half-hourly update. No TempleOSRS requests: it only re-reads the saved data and the
# mod entries. Kept separate from update.yml so it still works after that one is switched
# off when the results are final.
name: Apply mod entries

on:
  repository_dispatch:
    types: [mod-entry]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-board      # same group as the other jobs, so their saves never collide
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild the board with the mod entries
        run: node update.js --rebuild

      - name: Rebuild the preview board (made-up data plus every mod entry)
        run: node update.js --preview

      - name: Save
        run: |
          [ -d data ] || { echo "No data yet."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Apply mod entries"
            git pull --rebase
            git push
          fi
