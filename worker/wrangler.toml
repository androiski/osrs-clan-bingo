# Cloudflare Worker for mod entries. Setup steps are in worker/README.md.
name = "runecraft-bingo-mods"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the Worker from a browser (comma-separated).
ALLOWED_ORIGINS = "https://androiski.github.io,http://localhost:8765"
GITHUB_REPO = "androiski/runecraft-clan-bingo"

# Created with `npx wrangler kv namespace create ENTRIES` (see worker/README.md).
[[kv_namespaces]]
binding = "ENTRIES"
id = "fe1f0a63096f4831a800b7b66f8fae82"
